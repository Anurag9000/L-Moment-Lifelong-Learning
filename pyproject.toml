[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmoment-lifelong-learning"
version = "0.2.0"
description = "L-moment centered open-world discovery and task-free continual learning research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "PyYAML>=6"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
vision = ["torch>=2.1", "torchvision>=0.16", "transformers>=4.42", "Pillow>=10"]
cifar10 = ["torch>=2.1", "torchvision>=0.16", "Pillow>=10"]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
lmoment-study = "lmoment_lifelong.cli:main"
lmoment-extract = "lmoment_lifelong.features:main"
lmoment-sweep = "lmoment_lifelong.sweeps:main"
lmoment-cifar10 = "lmoment_lifelong.cifar10_suite:main"
lmoment-cifar10-report = "lmoment_lifelong.cifar10_report:main"
lmoment-cifar10-sweep = "lmoment_lifelong.cifar10_sweep:main"
lmoment-cifar10-advanced = "lmoment_lifelong.cifar10_advanced:main"
lmoment-cifar10-advanced-sweep = "lmoment_lifelong.cifar10_advanced_sweep:main"
lmoment-cifar10-hypothesis26 = "lmoment_lifelong.hypothesis26:main"
lmoment-cifar10-tune = "lmoment_lifelong.cifar10_tuning:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
