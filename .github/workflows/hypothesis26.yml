name: CIFAR-10 hypothesis-only 26-job launcher contracts
on:
  push:
    branches: [main]
    paths:
      - "src/lmoment_lifelong/hypothesis26.py"
      - "src/lmoment_lifelong/cifar10_advanced.py"
      - "tests/test_hypothesis26.py"
      - "docs/CIFAR10_HYPOTHESIS26_EXECUTION.md"
      - "scripts/run_26_hypotheses.sh"
      - ".github/workflows/hypothesis26.yml"
  workflow_dispatch:
jobs:
  hypothesis26-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[cifar10,dev]'
      - name: Test exact 26 hypothesis-only runs and no baseline execution
        run: python -m pytest -q tests/test_hypothesis26.py
      - name: Verify one-seed batch-512 dry-run plan (no download)
        run: |
          python -m lmoment_lifelong.hypothesis26 --seed 0 --dry-run > /tmp/hypothesis26-dry-run.txt
          grep -q '"planned": 26' /tmp/hypothesis26-dry-run.txt
          grep -q '"batch_size": 512' /tmp/hypothesis26-dry-run.txt
