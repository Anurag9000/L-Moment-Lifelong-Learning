name: CIFAR-10 advanced actual-image reference pilots
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cifar10_advanced_real.yml"
  workflow_dispatch:
jobs:
  cifar10-advanced-image-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[cifar10,dev]'
      - name: Cache CIFAR-10 dataset for later confirmation runs
        uses: actions/cache@v4
        with:
          path: datasets
          key: torchvision-cifar10-v1
      - name: Run advanced E01-E11 reference variants on actual CIFAR-10
        shell: bash
        run: |
          set +e
          errors=0
          for spec in E01 E02 E03:ncd E03:gcd E04 E05 E06 E07 E08 E09 E10 E11; do
            track="${spec%%:*}"
            mode="gcd"
            if [[ "$spec" == *:* ]]; then mode="${spec#*:}"; fi
            echo "BEGIN $spec"
            python -m lmoment_lifelong.cifar10_advanced \
              --track "$track" --gcd-mode "$mode" --download \
              --samples-per-class 16 --val-per-class 8 --test-per-class 8 \
              --ssl-epochs 1 --batch-size 32 --feature-dim 16 \
              --gcd-epochs-base 1 --gcd-epochs-session 1 \
              --min-support 4 --memory-bytes 8192 \
              --output-root results/cifar10_advanced 2>&1 | tee "${track}_${mode}.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "FAILED $spec $rc" | tee -a failures.txt
              errors=$((errors+1))
            fi
          done
          python -m lmoment_lifelong.cifar10_report \
            --root results/cifar10_advanced \
            --output results/cifar10_advanced/summary.csv
          echo "Failure count: $errors"
          test "$errors" -eq 0
      - name: Preserve model checkpoints, comparisons and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cifar10-advanced-real-image-pilot
          path: |
            results/cifar10_advanced/
            E*.log
            failures.txt
          if-no-files-found: warn
          retention-days: 30
