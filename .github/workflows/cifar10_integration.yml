name: CIFAR-10 actual-image integration smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cifar10_integration.yml"
  workflow_dispatch:
jobs:
  cifar10-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[cifar10,dev]'
      - name: Execute every E01-E14 reference on actual CIFAR-10
        shell: bash
        run: |
          set +e
          failures=0
          for study in E01 E02 E03 E04 E05 E06 E07 E08 E09 E10 E11 E12 E13 E14; do
            echo "BEGIN $study"
            python -m lmoment_lifelong.cifar10_suite \
              --track "$study" --variant both --download \
              --samples-per-class 16 --val-per-class 8 --test-per-class 8 \
              --epochs 1 --ssl-epochs 1 --batch-size 16 --feature-dim 16 \
              --seed 0 --output-root results/cifar10 2>&1 | tee "$study.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "$study failed with exit code $rc" | tee -a failures.txt
              failures=$((failures + 1))
            fi
          done
          python -m lmoment_lifelong.cifar10_report \
            --root results/cifar10 --output results/cifar10/summary.csv
          echo "Failed track count: $failures"
          test "$failures" -eq 0
      - name: Preserve measured results and logs, including failed tracks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cifar10-real-data-reference-results
          path: |
            results/cifar10/
            E*.log
            failures.txt
          if-no-files-found: warn
          retention-days: 30
